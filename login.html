<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — VOIDWEAR</title>
  <link rel="stylesheet" href="css/main.css" />
  <style>
    .auth-wrap {
      min-height: calc(100svh - var(--header-h));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--sp-12) var(--gutter);
      background:
        radial-gradient(ellipse 60% 50% at 20% 80%, rgba(184,245,58,.05) 0%, transparent 60%),
        var(--clr-bg);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
    }
    .auth-logo {
      display: block;
      font-family: var(--font-display);
      font-size: var(--fs-3xl);
      font-weight: var(--fw-black);
      letter-spacing: var(--ls-tight);
      text-transform: uppercase;
      text-align: center;
      margin-bottom: var(--sp-8);
    }
    .auth-logo span { color: var(--clr-accent); }
    .auth-box {
      background: var(--clr-surface);
      border: 1px solid var(--clr-border);
      padding: var(--sp-8);
    }
    .auth-box h1 {
      font-size: var(--fs-2xl);
      letter-spacing: var(--ls-tight);
      margin-bottom: var(--sp-2);
    }
    .auth-box .auth-sub {
      font-size: var(--fs-sm);
      color: var(--clr-text-3);
      margin-bottom: var(--sp-8);
    }
    .auth-form { display: flex; flex-direction: column; gap: var(--sp-5); }
    .auth-submit { margin-top: var(--sp-2); position: relative; }
    .auth-submit.loading { pointer-events: none; opacity: .8; }
    .auth-global-error {
      background: rgba(255,45,45,.08);
      border: 1px solid rgba(255,45,45,.25);
      color: var(--clr-red);
      padding: var(--sp-3) var(--sp-4);
      font-size: var(--fs-sm);
      letter-spacing: .02em;
      display: none;
    }
    .auth-global-error.visible { display: block; }
    .auth-footer {
      text-align: center;
      margin-top: var(--sp-6);
      font-size: var(--fs-sm);
      color: var(--clr-text-3);
    }
    .auth-footer a {
      color: var(--clr-accent);
      font-weight: var(--fw-bold);
      transition: opacity var(--transition-fast);
    }
    .auth-footer a:hover { opacity: .8; }
    .demo-hint {
      margin-top: var(--sp-6);
      padding: var(--sp-4);
      background: var(--clr-bg-3);
      border: 1px dashed var(--clr-border);
      font-size: var(--fs-xs);
      color: var(--clr-text-3);
      line-height: var(--lh-loose);
    }
    .demo-hint strong { color: var(--clr-accent); }
    .password-wrap { position: relative; }
    .toggle-pw {
      position: absolute; right: var(--sp-3); top: 50%;
      transform: translateY(-50%);
      font-size: var(--fs-xs); letter-spacing: var(--ls-wide);
      text-transform: uppercase; color: var(--clr-text-3);
      cursor: pointer; user-select: none;
      transition: color var(--transition-fast);
    }
    .toggle-pw:hover { color: var(--clr-accent); }
    .divider-or {
      display: flex; align-items: center; gap: var(--sp-4);
      font-size: var(--fs-xs); letter-spacing: var(--ls-wider);
      text-transform: uppercase; color: var(--clr-text-3);
      margin: var(--sp-2) 0;
    }
    .divider-or::before, .divider-or::after {
      content: ''; flex: 1; height: 1px; background: var(--clr-border);
    }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>

  <main class="page-main" style="padding-top:0">
    <div class="auth-wrap">
      <div class="auth-card">

        <a href="index.html" class="auth-logo">VOID<span>WEAR</span></a>

        <div class="auth-box">
          <h1>Welcome Back</h1>
          <p class="auth-sub">Sign in to your account to continue.</p>

          <div class="auth-global-error" id="global-error" role="alert"></div>

          <form class="auth-form" id="login-form" novalidate>
            <div class="form-group">
              <label class="form-label" for="email">Email Address</label>
              <input class="form-control" id="email" name="email" type="email"
                     placeholder="you@email.com" autocomplete="email"
                     inputmode="email" />
              <div class="form-error" id="err-email"></div>
            </div>

            <div class="form-group">
              <label class="form-label" for="password">Password</label>
              <div class="password-wrap">
                <input class="form-control" id="password" name="password" type="password"
                       placeholder="••••••••" autocomplete="current-password"
                       style="padding-right:3.5rem" />
                <span class="toggle-pw" id="toggle-pw" role="button"
                      tabindex="0" aria-label="Toggle password visibility">Show</span>
              </div>
              <div class="form-error" id="err-password"></div>
            </div>

            <button type="submit" class="btn btn-primary btn-xl btn-block auth-submit"
                    id="login-btn">
              Sign In
            </button>
          </form>

          <div class="divider-or" style="margin-top:var(--sp-6)">or</div>

          <a href="signup.html" class="btn btn-secondary btn-block btn-lg">
            Create an Account
          </a>

          <!-- Demo credentials hint -->
          <div class="demo-hint">
            <strong>Demo account:</strong><br>
            Email: <strong>demo@voidwear.com</strong><br>
            Password: <strong>demo1234</strong>
          </div>
        </div>

        <div class="auth-footer">
          Don't have an account? <a href="signup.html">Sign up free</a>
        </div>

      </div>
    </div>
  </main>

  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
